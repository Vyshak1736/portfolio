services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ledger]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py process_events
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
